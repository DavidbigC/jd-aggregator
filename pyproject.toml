[project]
name = "jobradar"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27", "fastapi>=0.115", "uvicorn>=0.30", "jinja2>=3.1", "defusedxml>=0.7",
                "cloakbrowser==0.6.3", "trafilatura==2.3.1", "langdetect==1.0.9"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jobradar = ["web/templates/*.html", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
