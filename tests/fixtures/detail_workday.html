    <meta name="title" property="og:title" content="Director, Partner Management, Americas">
    <meta name="description" property="og:description" content="Circle (NYSE: CRCL) is one of the world’s leading internet financial platform companies, building the foundation of a more open, global economy through digital assets, payment applications, and programmable blockchain infrastructure. Circle’s platform includes the world’s largest regulated stablecoin network anchored by USDC, Circle Payments Network for global money movement, and Arc, an enterprise-grade blockchain designed to become the Economic OS for the internet. Enterprises, financial institutions, and developers use Circle to power trusted, internet-scale financial innovation. Learn more at circle.com. What you’ll be part of: Circle is committed to visibility and stability in everything we do. As we grow as an organization, we&#39;re expanding into some of the world&#39;s strongest jurisdictions. Speed and efficiency are motivators for our success and our employees live by our company values: High Integrity, Future Forward, Multistakeholder, Mindful, and Driven by Excellence. We have built a flexible work environment where new ideas are encouraged and everyone is a stakeholder. What you’ll be responsible for: Reporting to the VP, Payments &amp;amp; Enterprise, Americas, this position is pivotal in driving adoption and growth across Circle’s product portfolio to key partners, including payments companies, large corporates, financial institutions, and commerce platforms. You will be responsible for bringing first-of-kind partnerships from early-stage design through to launch, activation and growth. You will work with cross-functional team members across Circle’s Business Development, Product, Legal, Marketing, and Compliance teams to manage onboarding, operations needs, strategic growth initiatives, escalations, and day-to-day requirements. You will develop and maintain lasting partnerships with top accounts by providing creative direction to business leadership and identifying and driving shared goals. You will define a comprehensive relationship strategy with each partner, including building a strong working relationship with the Circle’s leadership team for executive sponsorship, business reviews, product adoption, campaign management, and ideas on how these initiatives can improve and impact our partner&#39;s long-term value. Most importantly, you will set the foundation for our long-term, successful customer relationships based on mutual trust and transparency. What you&#39;ll work on: Working cross-functionally to design and execute partner success plans and grow partnership scope and impact. Building partnership launch plans and drive results in Circle’s relationships with leading platform businesses. Developing deep and meaningful relationships with signed strategic accounts, providing proactive support and strategy to key account stakeholders, champions and influencers. Providing strategic and consultative direction to the growth of the overall region. Enabling onboarding for partners, project management of their launch plans, and forecasting of go-live dates against business goals and objectives. What you’ll bring to Circle: Core Requirements: 12+ years of Account Management or Business Development experience. A background in Payments, fintech, or digital assets. Familiarity with navigating large, complex Enterprise organizations. Excellent written and verbal communication skills. Familiarity with generative AI models (ChatGPT, Gemini, etc.) and prompt development. Preferred Requirements: Ownership mentality, grit, resiliency, and an optimistic attitude Ability to develop a deep understanding of partner’s business, goals and use cases Obsession with customer success: your number one responsibility is to ensure your customers&#39; best interests and growth by driving solid, tangible outcomes Experience/familiarity with Slack, Apple MacOS and GSuite. Circle is on a mission to create an inclusive financial future, with transparency at our core. We consider a wide variety of elements when crafting our compensation ranges and total compensation packages. Starting pay is determined by various factors, including but not limited to: relevant experience, skill set, qualifications, and other business and organizational needs. Please note that compensation ranges may differ for candidates in other locations. Base Pay Range: $195,000 - $241,667 We are an equal opportunity employer. We do not discriminate on the basis of race, religion, color, national origin, gender, sexual orientation, age, marital status, veteran status, or disability status, or any other protected status required by the laws in the locations where we hire. Additionally, Circle participates in the E-Verify Program in certain locations, as required by law. Should you require accommodations or assistance in our interview process because of a disability, please reach out to accommodations@circle.com for support. We respect your privacy and will connect with you separately from our interview process to accommodate your needs. #LI-Remote Circle believes in a future where digital dollars work securely around the world to create a more prosperous global economy for everyone. To accomplish this, we created USDC, a digital currency backed by the US dollar and always redeemable 1:1. We work closely with regulators to ensure our digital dollar guides and surpasses the standards for stablecoins. By doing this, USDC has the potential to change how money moves around the world. Our values of Multistakeholder, Mindful, Driven by excellence, and High integrity drive us to succeed. Valuing our employees as stakeholders is about creating an environment where people can thrive and grow, be challenged and learn constantly – an environment that thrives on diversity by drawing competitive strength from within. Employees take pride in Circle’s culture and values. That’s why community members from around the world say we’re a top place to work.">
